tasks.register('createProperties') {
    dependsOn processResources
    def propsFileProvider = layout.buildDirectory.file("resources/main/version.properties")
    outputs.file(propsFileProvider)

    // Capture values at configuration time (safe for configuration cache)
    def versionValue = project.version.toString()
    def steamworksValue = project.ext['steamworks4j-serverVersion'] as String

    // Declare inputs so Gradle knows when to rerun
    inputs.property("version", versionValue)
    inputs.property("steamworksVersion", steamworksValue)

    doLast {
        def propsFile = propsFileProvider.get().asFile
        propsFile.parentFile.mkdirs()
        Properties p = new Properties()
        p['create-version'] = inputs.properties['version']
        p['lwjgl-version'] = project.properties['lwjglVersion']
        p['joml-version'] = project.properties['jomlVersion']
        p['joml-primitives-version'] = project.properties['joml-primitivesVersion']
        p['steamworks4j-version'] = project.properties['steamworks4jVersion']
        p['steamworks4j-server-version'] = project.properties['steamworks4j-serverVersion']
        p['querz-NBT-version'] = project.properties['querz-NBTversion']
        propsFile.withWriter { w -> p.store(w, null) }
    }
}

// Modern way to declare dependency
tasks.named('classes') {
    dependsOn(tasks.named('createProperties'))
}

test {
    useJUnitPlatform()
}